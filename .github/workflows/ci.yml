# Required pull-request gates. Their stable job names intentionally match the
# Skynet-Ventures repository protection contract.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # The parity closure deliberately verifies immutable predecessor and
          # open-slice commits, not merely the PR tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate pinned Hermes authority manifest
        run: python3 scripts/check_hermes_upstream.py

      - name: Validate complete Hermes production-range closure
        run: |
          python3 scripts/check_hermes_full_range_closure.py
          python3 -m unittest \
            scripts/test_check_hermes_authority_delta.py \
            scripts/test_check_hermes_client_wire_delta.py \
            scripts/test_check_hermes_core_runtime_delta.py \
            scripts/test_check_hermes_desktop_delta.py \
            scripts/test_check_hermes_cli_delta.py \
            scripts/test_check_hermes_gateway_platform_delta.py \
            scripts/test_check_hermes_residual_runtime_delta.py \
            scripts/test_check_hermes_full_range_closure.py

      - name: Toolchain info
        run: xcodebuild -version && swift --version

      - name: swift build
        working-directory: Packages/Talaria
        run: swift build

      - name: Swift tests
        working-directory: Packages/Talaria
        run: swift test

      - name: Protocol checks
        working-directory: Packages/Talaria
        run: swift run talaria-verify

      - name: Push relay source-routing tests
        run: |
          python3 -m pip install -e relay
          python3 -m unittest discover -s relay/tests -p 'test_*.py'

  release-gates:
    name: release-gates
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Assert Debug and Release entitlement mapping
        working-directory: ios
        run: |
          xcodebuild -project Talaria.xcodeproj -target Talaria -configuration Debug -showBuildSettings \
            | grep -q 'CODE_SIGN_ENTITLEMENTS = Talaria/Support/Talaria-dev.entitlements'
          xcodebuild -project Talaria.xcodeproj -target Talaria -configuration Release -showBuildSettings \
            | grep -q 'CODE_SIGN_ENTITLEMENTS = Talaria/Support/Talaria.entitlements'
          xcodebuild -project Talaria.xcodeproj -target TalariaWidgets -configuration Release -showBuildSettings \
            | grep -q 'CODE_SIGN_ENTITLEMENTS = Talaria/Support/TalariaWidgets.entitlements'
          plutil -lint Talaria/Support/Info.plist Talaria/Support/Talaria-dev.entitlements \
            Talaria/Support/Talaria.entitlements Talaria/Support/TalariaWidgets.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' Talaria/Support/Talaria-dev.entitlements)" = development
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' Talaria/Support/Talaria.entitlements)" = production
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.usernotifications.communication' Talaria/Support/Talaria-dev.entitlements)" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.usernotifications.communication' Talaria/Support/Talaria.entitlements)" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' Talaria/Support/TalariaWidgets.entitlements)" = group.bot.talaria.ios
          /usr/libexec/PlistBuddy -c 'Print :NSUserActivityTypes:0' Talaria/Support/Info.plist | grep -qx INSendMessageIntent

      - name: Build Debug for iOS Simulator (unsigned)
        working-directory: ios
        run: |
          xcodebuild build \
            -project Talaria.xcodeproj \
            -scheme Talaria \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build Release for iOS Simulator (unsigned)
        working-directory: ios
        run: |
          xcodebuild build \
            -project Talaria.xcodeproj \
            -scheme Talaria \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  optional-privacy:
    name: optional-privacy
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Multi-gateway source isolation is Talaria's privacy boundary: a short
      # Hermes runtime id may collide across machines, but messages and
      # approvals must never cross that boundary.
      - name: Source-qualified isolation regressions
        working-directory: Packages/Talaria
        run: |
          swift test --filter SourceQualifiedRoutingTests
          swift test --filter PushDeviceMutationQueueTests
